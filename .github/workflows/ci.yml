name: CI

# Architecture fitness functions. Every push and PR must keep the layer boundaries the
# codebase already follows, typecheck, and build. A violation fails the build here rather
# than rotting in main -- this is what keeps the reactor clean instead of a tangle of wires.
on:
  push:
    branches: [main, ledger]
  pull_request:

jobs:
  backend:
    name: Backend — layer boundaries + import health
    runs-on: ubuntu-latest
    env:
      # import-linter builds the import graph, and backend.database reads these at import
      # time. Throwaway values -- nothing here connects to anything real.
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-not-a-real-secret"
      AWS_ACCESS_KEY_ID: "mock"
      AWS_SECRET_ACCESS_KEY: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Layer boundaries (import-linter)
        run: lint-imports
      - name: App imports cleanly
        run: python -c "import backend.main; print('backend imports OK')"

  frontend:
    name: Frontend — types + module boundaries + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Module boundaries (dependency-cruiser)
        run: npx depcruise src
      - name: Production build
        run: npm run build
