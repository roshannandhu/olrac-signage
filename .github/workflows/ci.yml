name: CI

# Architecture fitness functions. Every push and PR must keep the layer boundaries the
# codebase already follows, typecheck, and build. A violation fails the build here rather
# than rotting in main -- this is what keeps the reactor clean instead of a tangle of wires.
on:
  push:
    branches: [main, ledger]
  pull_request:

jobs:
  backend:
    name: Backend — layer boundaries + import health
    runs-on: ubuntu-latest
    env:
      # import-linter builds the import graph, and backend.database reads these at import
      # time. Throwaway values -- nothing here connects to anything real.
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-not-a-real-secret"
      AWS_ACCESS_KEY_ID: "mock"
      AWS_SECRET_ACCESS_KEY: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Layer boundaries (import-linter)
        run: lint-imports
      - name: No embedded storage credentials
        # Hardcoding a key makes blank thumbnails disappear instantly, which is why it kept
        # getting re-added -- into a public backend module and into the browser bundle --
        # and why the bug kept coming back a rotation later. Runs here rather than only in
        # the test suite because this job is the gate a push actually has to pass.
        run: python tests/test_no_embedded_credentials.py
      - name: App imports cleanly
        run: python -c "import backend.main; print('backend imports OK')"

  frontend:
    name: Frontend — types + module boundaries + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: dependency-cruiser 18 requires ^22||^24||>=26.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Module boundaries (dependency-cruiser)
        run: npx depcruise src
      - name: Production build
        run: npm run build
