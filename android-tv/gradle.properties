android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# org.gradle.java.home is deliberately NOT set here.
#
# It was pinned to C:\Users\Roshan Raj\jdk-17\jdk-17.0.2 -- an absolute path on one
# developer's Windows machine, in a file that is committed. Every other machine failed the
# build immediately with "Java home supplied is invalid", including CI and this Linux box.
#
# Gradle uses JAVA_HOME (or the JDK running the wrapper) when this is unset, which is what
# makes the build portable. If you need to pin a specific JDK, put it in your own
# ~/.gradle/gradle.properties or in local.properties -- both are per-machine and neither is
# committed.
