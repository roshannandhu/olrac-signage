services:
  db:
    image: postgres:15-alpine
    container_name: olrac_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olrac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olrac_password}
      POSTGRES_DB: ${POSTGRES_DB:-olrac_signage}
    # Bound to loopback: "5432:5432" published the database on every interface of the
    # host, which on a cloud VM is the open internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olrac}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: olrac_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-olrac}:${POSTGRES_PASSWORD:-olrac_password}@db:5432/${POSTGRES_DB:-olrac_signage}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-mock}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-mock}
      - AWS_REGION=${AWS_REGION:-auto}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-olrac-media}
      - SECRET_KEY=${SECRET_KEY}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - PLAYER_VERSION_CODE=${PLAYER_VERSION_CODE:-1}
      - PLAYER_VERSION_NAME=${PLAYER_VERSION_NAME:-1.0}
      - PLAYER_APK_URL=${PLAYER_APK_URL:-}
      - PLAYER_UPDATE_MANDATORY=${PLAYER_UPDATE_MANDATORY:-false}
      - PLAYER_SYNC_INTERVAL_SECONDS=${PLAYER_SYNC_INTERVAL_SECONDS:-60}
      - SCREEN_OFFLINE_AFTER_SECONDS=${SCREEN_OFFLINE_AFTER_SECONDS:-150}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-razorpay}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - RAZORPAY_STARTER_MONTHLY_PLAN_ID=${RAZORPAY_STARTER_MONTHLY_PLAN_ID:-}
      - RAZORPAY_STARTER_YEARLY_PLAN_ID=${RAZORPAY_STARTER_YEARLY_PLAN_ID:-}
      - RAZORPAY_BUSINESS_MONTHLY_PLAN_ID=${RAZORPAY_BUSINESS_MONTHLY_PLAN_ID:-}
      - RAZORPAY_BUSINESS_YEARLY_PLAN_ID=${RAZORPAY_BUSINESS_YEARLY_PLAN_ID:-}
      - BILLING_GRACE_DAYS=${BILLING_GRACE_DAYS:-7}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Read by the code but never passed here, so in Docker the client-report map was
      # always blank and the P9 provisioning QR could not be generated at all.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - PROVISIONING_APK_URL=${PROVISIONING_APK_URL:-}
      - PROVISIONING_CERT_SHA256_BASE64=${PROVISIONING_CERT_SHA256_BASE64:-}
      - PLAY_LOG_RETENTION_DAYS=${PLAY_LOG_RETENTION_DAYS:-180}
      - SCREENSHOT_KEEP_PER_SCREEN=${SCREENSHOT_KEEP_PER_SCREEN:-10}
      - PLAYER_APK_SHA256=${PLAYER_APK_SHA256:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Shared with the worker. Both containers resolve UPLOAD_DIR to /app/uploads,
      # and with AWS_ACCESS_KEY_ID=mock (the default) media lives on local disk. Without
      # a shared volume the worker cannot see the file the backend just saved, so every
      # transcode fails — and any media that did land is lost on the next restart.
      - uploads_data:/app/uploads
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: olrac_worker
    command: python -m arq backend.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-olrac}:${POSTGRES_PASSWORD:-olrac_password}@db:5432/${POSTGRES_DB:-olrac_signage}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-mock}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-mock}
      - AWS_REGION=${AWS_REGION:-auto}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-olrac-media}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # The worker writes renditions and prunes screenshots, so it needs the same
      # retention settings and public origin the backend has.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - PLAY_LOG_RETENTION_DAYS=${PLAY_LOG_RETENTION_DAYS:-180}
      - SCREENSHOT_KEEP_PER_SCREEN=${SCREENSHOT_KEEP_PER_SCREEN:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Shared with the worker. Both containers resolve UPLOAD_DIR to /app/uploads,
      # and with AWS_ACCESS_KEY_ID=mock (the default) media lives on local disk. Without
      # a shared volume the worker cannot see the file the backend just saved, so every
      # transcode fails — and any media that did land is lost on the next restart.
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Next inlines NEXT_PUBLIC_* at build time. Setting them under `environment`
      # did nothing: the bundle was compiled with the defaults, so every deployment
      # that was not on localhost shipped a dashboard calling an API that was not there.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    container_name: olrac_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: olrac_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # The worker exits if Redis is not reachable at start-up, so the services that depend
    # on it wait for a real PONG rather than merely for the container to exist.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  uploads_data:
  postgres_data:
  redis_data:
