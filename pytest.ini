[pytest]
testpaths = tests

# Only files listed here are imported by pytest as normal test modules.
#
# Everything else in tests/ that matches test_*.py is a standalone SCRIPT, collected as a
# subprocess by tests/conftest.py. Those scripts must never be imported into the pytest
# process: each one sets DATABASE_URL to its own throwaway database and then imports
# backend, and backend/database.py builds its engine at import time. Importing two of them
# into one process means the first import wins and the rest run against the wrong database
# — which showed up as `relation "users" already exists` when Alembic then ran on a
# database create_all had already populated.
#
# Add a filename here only if it is a genuine pytest module (uses fixtures, marks, or
# test_* functions). Otherwise add it to ISOLATED_SCRIPTS in tests/conftest.py.
python_files = test_media_worker.py test_rotation.py test_rollout_policy.py test_media_storage.py test_alerting.py test_maps_link.py test_rendition_defaults.py test_storage_prefix.py test_tv_deep_link.py test_plan_quote.py
